# More than one replica needs audit.persistence.enabled=false (or one audit volume per pod):
# several servers appending to the same audit.jsonl fork the hash chain.
replicaCount: 1

image:
  repository: god-clause
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 3000

server:
  port: 3000
  logLevel: "info"
  # Secret for HMAC signing of the audit chain and the bearer token clients must send.
  # Leave both blank and set existingSecret (keys: hmac-secret, api-token) in production.
  hmacSecret: ""
  apiToken: ""
  existingSecret: ""
  existingSecretKey: "hmac-secret"
  apiTokenSecretKey: "api-token"

audit:
  # Directory for audit log files inside the container
  dir: "/data/audit"
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""

contracts:
  # Required. ConfigMap mounted at /app/contracts, where the server loads contracts from;
  # without a contract the server answers 503 and the pod never becomes ready.
  configMapName: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}
